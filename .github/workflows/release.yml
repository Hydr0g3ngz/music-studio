name: release
on:
  push:
    tags: ['v0.1.*']
permissions:
  contents: read
jobs:
  validation:
    uses: ./.github/workflows/tests.yml
  preview:
    needs: validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[ui,benchmark,dev]"
      - name: Verify tag matches the package
        shell: python
        run: |
          import os
          from music_studio import __version__
          assert os.environ['GITHUB_REF_NAME'] == f'v{__version__}'
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: node --test tests/ui_playback.test.cjs tests/ui_i18n.test.cjs
      - run: python scripts/package_release.py
      - name: Verify the installed preview wheel without neural dependencies
        shell: pwsh
        run: |
          python -m venv .release-check
          $wheel = (Get-ChildItem dist/*.whl).FullName
          & .release-check/Scripts/python.exe -m pip install "$wheel[ui]" httpx
          & .release-check/Scripts/python.exe scripts/verify_release.py --no-models
          if ($LASTEXITCODE -ne 0) { throw 'Clean wheel validation failed' }
      - name: Prepare verified desktop build tools
        shell: pwsh
        run: |
          python scripts/prepare_installer_tools.py
          $toolDir = Join-Path $PWD '.artifacts/desktop-build-tools/inno'
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$toolDir")
          $setup = Start-Process .artifacts/desktop-build-tools/innosetup-6.7.3.exe -ArgumentList $args -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Inno setup failed' }
      - name: Build independent installer with basic models
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          python scripts/package_installer.py --wheel $wheel --payload .artifacts/installer/payload --dist .artifacts/installer/dist --tools .artifacts/desktop-build-tools
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          & .artifacts/installer/payload/runtime/python.exe -X utf8 scripts/verify_installer.py --payload .artifacts/installer/payload --workspace .artifacts/installer/verification
          if ($LASTEXITCODE -ne 0) { throw 'Bundled offline inference failed' }
          Copy-Item .artifacts/installer/dist/*.exe dist/
          Get-Content .artifacts/installer/dist/SHA256SUMS.txt | Add-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/*
  publish:
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - name: Publish song-analysis release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --latest --title "Music Studio $RELEASE_TAG · Song analysis" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
